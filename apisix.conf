# Local APISIX config for development via apisix-docker-compose.yml.
# Mounted to /usr/local/apisix/conf/config.yaml inside the APISIX container.

apisix:
  node_listen: 9080
  enable_ipv6: false

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd

  admin:
    admin_listen:
      ip: 0.0.0.0
      port: 9180
    allow_admin:
      - 127.0.0.0/24
    admin_key:
      - name: admin
        key: arandomapikeyfordevelopment
        role: admin

  etcd:
    host:
      - "http://127.0.0.1:2379"
    prefix: "/apisix"
